name: AirBatteryHrostXCUITest
developmentLanguage: en

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
  localPackagesGroup: Packages

packages:
  AirBatteryPackage:
    path: ../..
    group: Packages
  HrostPackage:
    path: ../../../hrost
    group: Packages

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"

schemes:
  AirBatteryHrostXCUITest:
    build:
      targets:
        AirBatteryHrostFixtureApp: all
        AirBatteryHrostUITests: [test]
    test:
      targets:
        - AirBatteryHrostUITests


targets:
  AirBatteryHrostFixtureApp:
    type: application
    platform: macOS
    sources:
      - path: ../../Packaging/App
      - path: ../../AirBattery/Assets.xcassets
        buildPhase: resources
      - path: ../../AirBattery/Base.lproj
        buildPhase: resources
      - path: ../../AirBattery/en.lproj
        buildPhase: resources
      - path: ../../AirBattery/Supports/logReader.sh
        buildPhase: resources
      - path: ../../AirBattery/Supports/Scriptable.sdef
        buildPhase: resources
    dependencies:
      - package: AirBatteryPackage
        product: AirBatteryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephcourtney.AirBattery
        PRODUCT_NAME: AirBattery
        INFOPLIST_FILE: ../../AirBattery/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: AirBattery uses Bluetooth to collect battery information from peripheral devices.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: AirBattery will collect battery information through the local network.
        ENABLE_HARDENED_RUNTIME: "NO"

  AirBatteryHrostUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: AirBatteryHrostFixtureApp
      - package: HrostPackage
        product: HrostXCUITest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephcourtney.AirBattery.HrostUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: AirBatteryHrostFixtureApp
        ENABLE_HARDENED_RUNTIME: "NO"
