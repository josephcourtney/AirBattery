name: Temporary Bash 3.2 selector fix

on:
  push:
    branches:
      - ui/widget-gallery-previews
    paths:
      - .github/workflows/fix-capture-bash32.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/widget-gallery-previews
          fetch-depth: 0

      - name: Patch selector bookkeeping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/capture_airbattery_gui.sh")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'ONLY_PATTERNS=()\nSKIP_PATTERNS=()\n',
              'ONLY_PATTERNS=()\nSKIP_PATTERNS=()\nONLY_PATTERN_COUNT=0\nSKIP_PATTERN_COUNT=0\n',
          )

          replace_once(
              '''want_capture(){
            target="$1"

            if [ "${#ONLY_PATTERNS[@]}" -gt 0 ]; then
              selected=0
              for pattern in "${ONLY_PATTERNS[@]}"; do
                if matches_pattern "$target" "$pattern"; then
                  selected=1
                  break
                fi
              done
              [ "$selected" = "1" ] || return 1
            fi

            for pattern in "${SKIP_PATTERNS[@]}"; do
              matches_pattern "$target" "$pattern" && return 1
            done

            return 0
          }
          ''',
              '''want_capture(){
            target="$1"

            if [ "$ONLY_PATTERN_COUNT" -gt 0 ]; then
              selected=0
              i=0
              while [ "$i" -lt "$ONLY_PATTERN_COUNT" ]; do
                pattern="${ONLY_PATTERNS[$i]}"
                if matches_pattern "$target" "$pattern"; then
                  selected=1
                  break
                fi
                i=$((i + 1))
              done
              [ "$selected" = "1" ] || return 1
            fi

            i=0
            while [ "$i" -lt "$SKIP_PATTERN_COUNT" ]; do
              pattern="${SKIP_PATTERNS[$i]}"
              matches_pattern "$target" "$pattern" && return 1
              i=$((i + 1))
            done

            return 0
          }
          ''',
          )

          replace_once(
              '''    --only)
                [ "$#" -ge 2 ] || { echo "--only requires a glob" >&2; exit 2; }
                ONLY_PATTERNS+=("$2")
                shift 2
                ;;
              ''',
              '''    --only)
                [ "$#" -ge 2 ] || { echo "--only requires a glob" >&2; exit 2; }
                ONLY_PATTERNS[$ONLY_PATTERN_COUNT]="$2"
                ONLY_PATTERN_COUNT=$((ONLY_PATTERN_COUNT + 1))
                shift 2
                ;;
              ''',
          )
          replace_once(
              '''    --only=*)
                ONLY_PATTERNS+=("${1#--only=}")
                shift
                ;;
              ''',
              '''    --only=*)
                ONLY_PATTERNS[$ONLY_PATTERN_COUNT]="${1#--only=}"
                ONLY_PATTERN_COUNT=$((ONLY_PATTERN_COUNT + 1))
                shift
                ;;
              ''',
          )
          replace_once(
              '''    --skip)
                [ "$#" -ge 2 ] || { echo "--skip requires a glob" >&2; exit 2; }
                SKIP_PATTERNS+=("$2")
                shift 2
                ;;
              ''',
              '''    --skip)
                [ "$#" -ge 2 ] || { echo "--skip requires a glob" >&2; exit 2; }
                SKIP_PATTERNS[$SKIP_PATTERN_COUNT]="$2"
                SKIP_PATTERN_COUNT=$((SKIP_PATTERN_COUNT + 1))
                shift 2
                ;;
              ''',
          )
          replace_once(
              '''    --skip=*)
                SKIP_PATTERNS+=("${1#--skip=}")
                shift
                ;;
              ''',
              '''    --skip=*)
                SKIP_PATTERNS[$SKIP_PATTERN_COUNT]="${1#--skip=}"
                SKIP_PATTERN_COUNT=$((SKIP_PATTERN_COUNT + 1))
                shift
                ;;
              ''',
          )

          replace_once(
              '''for pattern in "${ONLY_PATTERNS[@]}"; do
            if ! pattern_matches_registry "$pattern"; then
              echo "No capture target matches --only '$pattern'." >&2
              echo "Use --list to see selectable targets." >&2
              exit 2
            fi
          done
          ''',
              '''i=0
          while [ "$i" -lt "$ONLY_PATTERN_COUNT" ]; do
            pattern="${ONLY_PATTERNS[$i]}"
            if ! pattern_matches_registry "$pattern"; then
              echo "No capture target matches --only '$pattern'." >&2
              echo "Use --list to see selectable targets." >&2
              exit 2
            fi
            i=$((i + 1))
          done
          ''',
          )

          text = text.replace(
              '[ "${#ONLY_PATTERNS[@]}" -gt 0 ]; then',
              '[ "$ONLY_PATTERN_COUNT" -gt 0 ]; then',
          )

          if '${ONLY_PATTERNS[@]}' in text or '${SKIP_PATTERNS[@]}' in text:
              raise SystemExit("unsafe empty-array expansion remains")

          path.write_text(text)
          PY

          /bin/bash -n scripts/capture_airbattery_gui.sh
          grep -q 'ONLY_PATTERN_COUNT=0' scripts/capture_airbattery_gui.sh
          grep -q 'SKIP_PATTERN_COUNT=0' scripts/capture_airbattery_gui.sh
          ! grep -Fq '${ONLY_PATTERNS[@]}' scripts/capture_airbattery_gui.sh
          ! grep -Fq '${SKIP_PATTERNS[@]}' scripts/capture_airbattery_gui.sh

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-capture-bash32.yml
          git add scripts/capture_airbattery_gui.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix capture selectors on macOS Bash 3.2'
          git push origin HEAD:ui/widget-gallery-previews
