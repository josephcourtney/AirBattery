name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: brew install just autoconf automake libtool pkg-config

      - name: Build
        run: just ci

      - name: Verify re-signing path
        run: SIGNING_IDENTITY=- just build-signed
