name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        run: brew install just

      - name: Build
        run: just ci

      - name: Verify ad-hoc packaging build
        run: just build-adhoc
